
# overrides for development environment
services:
  # Exposed server that's handling incoming web requests
  ohif_viewer:
    volumes:
      # Nginx config
      - ./config/nginx.conf:/etc/nginx/nginx.conf
      - ${CERTS_DIR}:/etc/nginx/ssl:ro
    env_file:
      - .\..\..\.env
    environment:
      - NODE_ENV=development
